# Builds the API docs with doc-gen4 and publishes them under api/, with the website in site/, to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake/packages
          key: docgen-${{ hashFiles('docbuild/lakefile.toml', 'lean-toolchain') }}
      - name: API docs
        run: cd docbuild && lake build TypeDB:docs
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docbuild/.lake/build/doc _site/api
          scripts/localize-api-docs.sh _site/api
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
